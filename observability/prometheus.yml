global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/generated-rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: kaiops-fault-lab
    metrics_path: /metrics
    static_configs:
      - targets: ["fault-lab:8080"]
        labels:
          synthetic: "true"
          event_mode: simulation
          environment: test

  # A dedicated bounded target for exercising the real KaiOpsServiceDown rule.
  # Fault Lab can return HTTP 503 here without disrupting its control API or KaiMS.
  - job_name: kaiops-fault-lab-service
    metrics_path: /service-health/metrics
    static_configs:
      - targets: ["fault-lab:8080"]
        labels:
          synthetic: "true"
          event_mode: simulation
          environment: test

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: kaiops-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: kaiops-monitoring-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-adapter:8000"]

  - job_name: kaiops-alert-intelligence
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-intelligence:8000"]

  - job_name: kaiops-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]

  - job_name: kaiops-context-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["context-agent:8000"]

  - job_name: kaiops-model-router
    metrics_path: /metrics
    static_configs:
      - targets: ["model-router:8000"]

  - job_name: kaiops-resolution-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["resolution-agent:8000"]

  - job_name: kaiops-approval-service
    metrics_path: /metrics
    static_configs:
      - targets: ["approval-service:8000"]

  - job_name: kaiops-remediation-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation-engine:8000"]

  - job_name: kaiops-closure-service
    metrics_path: /metrics
    static_configs:
      - targets: ["closure-service:8000"]

  - job_name: mysql-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  # - job_name: kube-state-metrics
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["kube-state-metrics:8080"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:8000/healthz
          - http://monitoring-adapter:8000/healthz
          - http://orchestrator:8000/healthz
          - http://resolution-agent:8000/healthz
          # Online Boutique has no app-level /metrics anywhere (verified
          # against source — initStats() is an unimplemented TODO in every
          # service), so its uptime/latency signal comes from this same
          # blackbox-exporter probing its real health endpoint.
      - targets: ["http://ob-frontend:8080/_healthz"]
        labels:
          environment: demo
          monitoring_scope: demo
          application: Online Boutique
          service: ob-frontend
      - targets: ["https://opentelemetry.io/"]
        labels:
          application: opentelemetry-demo
          project_name: KaiOps
          service: opentelemetry-demo
          environment: public-internet
          external: "true"
          synthetic: "false"
      - targets: ["https://www.githubstatus.com/api/v2/status.json"]
        labels:
          application: github-status
          project_name: KaiOps
          service: github-status
          environment: public-internet
          external: "true"
          synthetic: "false"
      - targets: ["https://parabank.parasoft.com/parabank/index.htm"]
        labels:
          application: parabank-public-demo
          project_name: ParaBank Public Demo
          service: parabank-web
          environment: public-demo
          owner_team: banking-platform
          external: "true"
          synthetic: "true"
          load_test_allowed: "false"
      - targets: ["https://httpbin.org/status/503"]
        labels:
          application: httpbin-failure-lab
          project_name: KaiOps
          service: httpbin-failure-lab
          environment: public-internet
          external: "true"
          synthetic: "true"
          # Intentional failure injection; never admit as a real incident.
          event_mode: "simulation"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Real per-container CPU/memory/restart signals for Online Boutique,
  # since it has no app-level metrics.
  - job_name: online-boutique-cadvisor
    static_configs:
      - targets: ["ob-cadvisor:8080"]
        labels:
          environment: demo
          monitoring_scope: demo

  # gRPC payment service availability. The application does not expose a
  # Prometheus endpoint, so probe its TCP listener through blackbox-exporter.
  - job_name: online-boutique-payment
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["ob-paymentservice:50051"]
        labels:
          application: Online Boutique
          project_name: Online Boutique
          service: ob-paymentservice
          environment: demo
          source_system: prometheus
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # rs-cart and rs-payment expose real Prometheus /metrics natively.
  - job_name: robot-shop-cart
    metrics_path: /metrics
    static_configs:
      - targets: ["rs-cart:8080"]
        labels:
          environment: demo
          monitoring_scope: demo

  - job_name: robot-shop-payment
    metrics_path: /metrics
    static_configs:
      - targets: ["rs-payment:8080"]
        labels:
          environment: demo
          monitoring_scope: demo

  # mongodb/redis/rabbitmq/mysql don't expose /metrics natively — standard
  # community exporters provide real infrastructure metrics instead.
  - job_name: robot-shop-mysql
    static_configs:
      - targets: ["rs-mysqld-exporter:9104"]
        labels:
          environment: demo
          monitoring_scope: demo

  - job_name: robot-shop-redis
    static_configs:
      - targets: ["rs-redis-exporter:9121"]
        labels:
          environment: demo
          monitoring_scope: demo

  - job_name: robot-shop-rabbitmq
    static_configs:
      - targets: ["rs-rabbitmq-exporter:9419"]
        labels:
          environment: demo
          monitoring_scope: demo

  - job_name: robot-shop-mongodb
    static_configs:
      - targets: ["rs-mongodb-exporter:9216"]
        labels:
          environment: demo
          monitoring_scope: demo

  - job_name: kaiops-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: kaiops-dynamic-applications
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/generated-targets/*.json
    relabel_configs:
      - source_labels: [__meta_filepath]
        target_label: kaiops_generated_target

  # Independent probes for local KaiMS service-outage recovery.
  - job_name: kaims-recovery-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/recovery-kaims-http-targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: kaims-recovery-dependencies
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [mysql:3306, rabbitmq:5672, redis:6379]
        labels:
          tenant_id: default
          environment: prod
          application: KaiMS
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115


  - job_name: demo-recovery-dependencies
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [ob-redis-cart:6379, ob-checkoutservice:5050]
        labels:
          tenant_id: default
          environment: demo
          application: Online Boutique
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: demo-recovery-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://rs-web:8080"]
        labels:
          tenant_id: default
          environment: prod
          application: Robot Shop
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: telemetry-application
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:18080/"]
        labels:
          project: telemetry
          application: Telemetry
          service: frontend-proxy
          environment: demo
          monitoring_scope: demo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: telemetry-catalog-journey
    metrics_path: /probe
    params:
      module: [http_product_catalog]
    static_configs:
      - targets: ["http://host.docker.internal:18080/api/products"]
        labels:
          project: telemetry
          application: Telemetry
          service: frontend-proxy
          environment: demo
          monitoring_scope: demo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: telemetry-monitoring
    static_configs:
      - targets: ["telemetry-prometheus:9090"]
        labels:
          project: telemetry
          application: Telemetry
          service: telemetry-prometheus
          environment: demo
          monitoring_scope: demo

  # Query API availability is independent of application and collector health.
  - job_name: telemetry-jaeger
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:26686/jaeger/ui/api/services"]
        labels:
          project: telemetry
          application: Telemetry
          service: jaeger
          environment: demo
          monitoring_scope: demo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
