global:
  resolve_timeout: 5m

route:
  receiver: kaiops-landing-pad
  group_by: [alertname, service, severity]
  group_wait: 2s
  group_interval: 15s
  repeat_interval: 2m
  routes:
    # Controlled real-fault recovery scope; other demo signals stay monitoring-only.
    - receiver: kaiops-landing-pad
      matchers:
        - project="telemetry"
        - environment="demo"
        - service="frontend-proxy"
        - alertname="TelemetryApplicationUnavailable"
    - receiver: demo-monitoring-only
      matchers:
        - monitoring_scope="demo"
    - receiver: demo-monitoring-only
      matchers:
        - environment="demo"
    - receiver: kaiops-landing-pad-realtime
      matchers:
        - category="latency"
      group_by: [alertname, service, operation, severity]
      group_wait: 0s
      group_interval: 10s
      repeat_interval: 1m

receivers:
  # Demo targets remain observable in Prometheus, without production tickets.
  - name: demo-monitoring-only
  - name: kaiops-landing-pad
    webhook_configs:
      - url: http://monitoring-adapter:8000/alerts/alertmanager
        send_resolved: true
  - name: kaiops-landing-pad-realtime
    webhook_configs:
      - url: http://monitoring-adapter:8000/alerts/alertmanager
        send_resolved: true
