server {
  listen 80;
  # Target gateway hostname. Works before DNS exists because this is the only
  # (default) server block — nginx answers any Host header, so localhost:8501
  # and direct VM-IP access keep working. Once DNS maps kaims-dev.com to the
  # VM's IP, the same config serves it with no further change.
  server_name kaims-dev.com;

  # Use Docker embedded DNS for runtime upstream name resolution.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  root /usr/share/nginx/html;
  index index.html;

  set $api_gateway_upstream http://api-gateway:8000;
  set $monitoring_adapter_upstream http://monitoring-adapter:8000;
  set $approval_service_upstream http://approval-service:8000;
  set $alert_intelligence_upstream http://alert-intelligence:8000;
  set $context_agent_upstream http://context-agent:8000;
  set $resolution_agent_upstream http://resolution-agent:8000;

  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_intercept_errors on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml;

  error_page 502 503 504 = @backend_unavailable;

  # Operational updates are server-sent events. Forward each frame immediately;
  # nginx response buffering otherwise leaves incident state stale until enough
  # event data accumulates to flush a proxy buffer.
  location = /api-gateway/events/operations {
    rewrite ^/api-gateway/?(.*)$ /$1 break;
    proxy_pass $api_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no always;
  }

  location /api-gateway/ {
    # Preserve actionable application errors (for example database recovery)
    # instead of rewriting every upstream 503 as a generic startup failure.
    proxy_intercept_errors off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    rewrite ^/api-gateway/?(.*)$ /$1 break;
    proxy_pass $api_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /monitoring-adapter/ {
    rewrite ^/monitoring-adapter/?(.*)$ /$1 break;
    proxy_pass $monitoring_adapter_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /approval-service/ {
    rewrite ^/approval-service/?(.*)$ /$1 break;
    proxy_pass $approval_service_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /build-info.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /assets/ {
    # Vite filenames contain a content hash, so these files are immutable.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /alert-intelligence/ {
    rewrite ^/alert-intelligence/?(.*)$ /$1 break;
    proxy_pass $alert_intelligence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Temporal-owned remediation calls may remain open while a bounded
    # run-to-completion executor finishes and reports its terminal status.
    proxy_send_timeout 1000s;
    proxy_read_timeout 1000s;
  }

  location /resolution-agent/ {
    rewrite ^/resolution-agent/?(.*)$ /$1 break;
    proxy_pass $resolution_agent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /context-agent/ {
    rewrite ^/context-agent/?(.*)$ /$1 break;
    proxy_pass $context_agent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live context collection can query multiple bounded evidence sources.
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  location = /kaims-mark.svg {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri /index.html;
  }

  location @backend_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"Backend service is starting or unavailable. Retry after the service health check passes.","status":"backend_unavailable"}';
  }
}
