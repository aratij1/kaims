x-bounded-logging: &bounded-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-service-build: &service-build
  context: .
  dockerfile: deploy/docker/Dockerfile.service
  args:
    KAIMS_RELEASE_SHA: ${KAIMS_RELEASE_SHA:-dev}
    KAIMS_BUILD_TIME: ${KAIMS_BUILD_TIME:-unknown}
    KAIMS_REQUIRE_RELEASE_PROVENANCE: ${KAIMS_REQUIRE_RELEASE_PROVENANCE:-false}

services:
  mysql:
    image: mysql:8.4
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    logging: *bounded-logging
    restart: unless-stopped
    # Raised from the image default so per-service DB_POOL_SIZE/DB_MAX_OVERFLOW
    # increases (needed for a 10k-alert burst) don't exhaust connections across
    # Shared services use 4+6 connections while the three ingestion-heavy
    # services retain their explicit larger pools. 450 leaves headroom without
    # encouraging the high per-connection memory ceiling of the old 900 value.
    # 2 MiB is bounded per sorting connection and prevents MySQL error 1038 on
    # legitimate operational queries while their covering indexes are built.
    command:
      - "--max-connections=${MYSQL_MAX_CONNECTIONS:-450}"
      - "--sort-buffer-size=${MYSQL_SORT_BUFFER_SIZE:-2097152}"
      - "--binlog-expire-logs-seconds=${MYSQL_BINLOG_RETENTION_SECONDS:-86400}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kaiops}
      MYSQL_USER: ${MYSQL_USER:-kaiops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kaiops}
    ports: ["${MYSQL_HOST_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-kaiops} -p${MYSQL_PASSWORD:-kaiops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-retention:
    image: ${MONITORING_ADAPTER_IMAGE:-kaiops_pubsub-monitoring-adapter:latest}
    init: true
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: mysql-retention
    working_dir: /app
    command: ["python", "/app/scripts/manage_mysql_retention.py", "--execute", "--daemon", "--interval-seconds", "3600", "--archive-dir", "/archives"]
    volumes:
      - ./scripts/manage_mysql_retention.py:/app/scripts/manage_mysql_retention.py:ro
      - ./backend/retention-archives:/archives
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/archives/last-run.json'); assert p.exists() and time.time()-p.stat().st_mtime < 90000 and not pathlib.Path('/archives/last-error.json').exists()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrations:
    build: *service-build
    restart: "no"
    environment: { <<: *service-env, SERVICE_NAME: migrations }
    mem_limit: ${MIGRATIONS_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    command: ["python", "scripts/apply-migrations.py"]
    working_dir: /app
    depends_on:
      mysql: { condition: service_healthy }

  temporal:
    image: temporalio/auto-setup:1.27.2
    mem_limit: ${TEMPORAL_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root}
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    ports: ["7233:7233"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    # Administrative tooling is opt-in so the normal KaiMS runtime does not
    # reserve memory for a second workflow UI. Start with --profile admin-tools.
    profiles: ["admin-tools", "full"]
    image: temporalio/ui:2.34.0
    mem_limit: ${TEMPORAL_UI_MEMORY_LIMIT:-256m}
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8501
    ports: ["8088:8080"]
    depends_on:
      temporal: { condition: service_healthy }

  redis:
    image: redis:7
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "noeviction"]
    logging: *bounded-logging
    restart: unless-stopped
    # Keep the container address stable while avoiding collisions with other
    # local projects that commonly publish Redis on the default host port.
    ports: ["${KAI_OPS_REDIS_PORT:-6380}:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.7.1
    mem_limit: ${ZOOKEEPER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    mem_limit: ${KAFKA_MEMORY_LIMIT:-1g}
    logging: *bounded-logging
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    logging: *bounded-logging
    # Core dependency: recover after Docker Desktop/WSL restarts even if a
    # previous diagnostic session explicitly stopped the container.
    restart: always
    init: true
    stop_grace_period: 90s
    mem_limit: 1g
    mem_reservation: 384m
    cpus: 2.0
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +SDcpu 1 +SDio 1"
    ports: ["5672:5672", "15672:15672"]
    volumes:
      # The previous volume is intentionally retained for offline recovery.
      # A clean broker store avoids boot-locking the platform when persisted
      # Erlang/RabbitMQ node state is left inconsistent after a VM crash.
      - rabbitmq-data-recovery:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 45s

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    mem_limit: ${EXPORTER_MEMORY_LIMIT:-128m}
    logging: *bounded-logging
    restart: unless-stopped
    # Uses a dedicated low-privilege monitoring user (PROCESS, REPLICATION
    # CLIENT only) instead of the app's MYSQL_USER — that user has ALL
    # PRIVILEGES on the app schema and previously lacked the global grants
    # mysqld_exporter's default scrapers need, which is what produced the
    # "Access denied; you need SUPER or REPLICATION CLIENT" alert. Reusing
    # the app user would also over-privilege it just to fix monitoring.
    command:
      - --mysqld.address=${MYSQL_EXPORTER_ADDRESS:-mysql:3306}
      - --mysqld.username=${MYSQL_EXPORTER_USER:-mysql_exporter}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-}
    ports: ["9104:9104"]
    depends_on:
      mysql: { condition: service_healthy }

  node-exporter:
    image: prom/node-exporter:v1.8.1
    mem_limit: ${EXPORTER_MEMORY_LIMIT:-128m}
    logging: *bounded-logging
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports: ["9100:9100"]

  kafka-exporter:
    profiles: ["kafka"]
    image: danielqsj/kafka-exporter:v1.7.0
    mem_limit: ${EXPORTER_MEMORY_LIMIT:-128m}
    logging: *bounded-logging
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
    ports: ["9308:9308"]
    depends_on:
      kafka: { condition: service_healthy }

  fault-lab:
    profiles:
      - fault-lab
    build: ./fault-lab
    mem_limit: ${FAULT_LAB_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    restart: unless-stopped
    # Produces the bounded application symptoms (HTTP errors, JSON logs, breached
    # Prometheus metrics) for the 50 KaiOps incident scenarios. Prometheus scrapes
    # /metrics; the discovery-service reads the shared runtime log for context.
    # Also emits real, correlated OTLP traces for each active fault (see
    # fault_lab.py's OTLP_TRACES_ENDPOINT docstring) so KaiMS's investigation
    # pipeline has genuine trace/dependency/topology evidence to find instead
    # of an always-empty Jaeger query.
    environment:
      FAULT_LAB_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector: { condition: service_started }
    ports: ["8080:8080"]
    volumes:
      - ./fault-lab/runtime:/app/runtime

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 1.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger: { condition: service_started }
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # jaegertracing/all-in-one runs as uid 10001, but the named volume it needs
  # for persistent badger storage is created root-owned. This one-shot init
  # fixes ownership before jaeger starts, so it never fails with "mkdir
  # /badger/key: permission denied".
  jaeger-init:
    image: busybox:1.36
    mem_limit: 128m
    logging: *bounded-logging
    restart: "no"
    volumes:
      - jaeger-data:/badger
    command: ["sh", "-c", "mkdir -p /badger/data /badger/key && chown -R 10001:10001 /badger"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    mem_limit: ${JAEGER_MEMORY_LIMIT:-3g}
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # The default all-in-one storage is in-memory with a fixed max-traces
      # cap; under steady fault-lab/demo traffic it evicts old traces within
      # minutes to hours, well before the evidence-enrichment backlog could
      # ever catch up to collect them (this is why "traces evidence" kept
      # coming back TRACE_NOT_FOUND_OR_EXPIRED even after the pipeline was
      # fixed - the data was already gone). Badger gives real, disk-backed,
      # time-based retention instead of a volatile in-memory eviction cache.
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_SPAN_STORE_TTL: ${JAEGER_TRACE_RETENTION:-168h0m0s}
      GOMEMLIMIT: ${JAEGER_GOMEMLIMIT:-768MiB}
      COLLECTOR_QUEUE_SIZE_MEMORY: "64"
    ports:
      - "16686:16686"
    volumes:
      - jaeger-data:/badger

  grafana:
    profiles: ["observability", "full"]
    image: grafana/grafana:11.2.2
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  monitoring-adapter:
    image: ${MONITORING_ADAPTER_IMAGE:-kaiops_pubsub-monitoring-adapter:latest}
    build: *service-build
    # Reap connector/subprocess children and forward stop signals cleanly.
    mem_limit: ${MONITORING_ADAPTER_MEMORY_LIMIT:-1g}
    logging: *bounded-logging
    init: true
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: monitoring-adapter
      # Keep maintenance and bulk ingestion out of the API-serving event loop.
      LANDING_PAD_FILE_WATCHER_ENABLED: "false"
      INCIDENT_PROJECTION_WORKER_ENABLED: "false"
      LOG_INGESTION_ENABLED: "false"
      EMAIL_INGESTION_ENABLED: "false"
      OPENSEARCH_LOG_INGESTION_ENABLED: "false"
      JIRA_POLLING_ENABLED: "false"
      # This service is on the ingestion hot path for a 10k-alert burst; give
      # it a larger DB pool than the shared default (paired with mysql's
      # raised max-connections above).
      DB_POOL_SIZE: ${MONITORING_ADAPTER_DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${MONITORING_ADAPTER_DB_MAX_OVERFLOW:-30}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/monitoring-adapter
    # A bare container port (not a fixed host:container mapping) lets Docker
    # assign a free host port per replica -- monitoring-adapter is in the
    # scale_service allowlist, and two containers cannot both bind the same
    # fixed host port. Find the current port with:
    # docker compose port monitoring-adapter 8000
    ports: ["8000"]
    volumes:
      - ./backend/rag:/app/rag
      - ${INGESTED_ALERTS_HOST_PATH:-./backend/ingested_alerts}:/app/ingested_alerts
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      docker-socket-proxy: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  monitoring-ingestion-worker:
    image: ${MONITORING_ADAPTER_IMAGE:-kaiops_pubsub-monitoring-adapter:latest}
    # Reap child processes from connector probes and file watchers so Docker
    mem_limit: ${MONITORING_WORKER_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    # can stop/recreate this long-running worker cleanly.
    init: true
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: monitoring-ingestion-worker
      LANDING_PAD_FILE_WATCHER_ENABLED: "true"
      INCIDENT_PROJECTION_WORKER_ENABLED: "true"
      LOG_INGESTION_ENABLED: "true"
      LOG_WATCH_PATHS: /app/backend/runtime:/app/fault-lab/runtime:/app/observability
      # The separate telemetry demo can emit its own exporter retry storm.
      # Do not recursively convert those infrastructure retries into KaiOps
      # incidents; enable this explicitly only for a healthy OpenSearch source.
      # This Compose stack has no OpenSearch service. Do not inherit a host-level
      # override that makes the worker repeatedly connect to a nonexistent backend.
      OPENSEARCH_LOG_INGESTION_ENABLED: "false"
      # Avoid background DNS/retry loops when inherited host variables contain
      # stale IMAP settings. Enable explicitly for this compose stack.
      EMAIL_INGESTION_ENABLED: ${KAI_OPS_EMAIL_INGESTION_ENABLED:-false}
      JIRA_POLLING_ENABLED: ${JIRA_POLLING_ENABLED:-false}
      DB_POOL_SIZE: ${MONITORING_WORKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${MONITORING_WORKER_DB_MAX_OVERFLOW:-10}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/monitoring-adapter
    volumes:
      - ./backend/rag:/app/rag
      - ${INGESTED_ALERTS_HOST_PATH:-./backend/ingested_alerts}:/app/ingested_alerts
      - ./backend/runtime:/app/backend/runtime:ro
      - ./fault-lab/runtime:/app/fault-lab/runtime:ro
      - ./observability:/app/observability:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      docker-socket-proxy: { condition: service_started }

  application-onboarding:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: application-onboarding }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/application-onboarding
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    # Bare container port -- application-onboarding is scale_service-eligible.
    # docker compose port application-onboarding 8000
    ports: ["8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  cloud-operations:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: cloud-operations }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/cloud-operations
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8027:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  connector-hub:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: connector-hub }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/connector-hub
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8028:8000"]
    depends_on:
      migrations: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  discovery-service:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: discovery-service
      # Discovery inspects the monitored app's source tree and runtime log to
      # build real context (services, technology, metrics endpoint, active
      # scenarios). The fault-lab is mounted read-only and shares its runtime log.
      DISCOVERY_CODEBASE_ROOT: /app/fault-lab
      DISCOVERY_LOG_PATH: /app/fault-lab/runtime/application.log
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/discovery-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8012:8000"]
    volumes:
      - ./fault-lab:/app/fault-lab:ro
    depends_on:
      application-onboarding: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  metrics-validation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: metrics-validation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/metrics-validation-agent
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8013:8000"]
    depends_on:
      discovery-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  rule-generation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: rule-generation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/rule-generation-agent
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8014:8000"]
    depends_on:
      metrics-validation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  prometheus-config-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: prometheus-config-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/prometheus-config-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8015:8000"]
    volumes:
      - ./backend/rag:/app/rag
    depends_on:
      rule-generation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  validation-agent:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: validation-agent }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/validation-agent
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8016:8000"]
    depends_on:
      prometheus-config-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  dashboard-generator:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: dashboard-generator }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/dashboard-generator
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8017:8000"]
    depends_on:
      validation-agent: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  audit-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: audit-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/audit-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8018:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  api-gateway:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: api-gateway
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-kaiops-local-service-token-change-me}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/api-gateway
    mem_limit: ${API_GATEWAY_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    # Bare container port, not a fixed mapping -- api-gateway is in the
    # scale_service allowlist and two replicas cannot share one host port.
    # docker compose port api-gateway 8000
    ports: ["8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s
    depends_on:
      migrations: { condition: service_completed_successfully }
      monitoring-adapter: { condition: service_started }
      application-onboarding: { condition: service_started }
      approval-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  alert-intelligence:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: alert-intelligence
      # This service is on the ingestion hot path for a 10k-alert burst; give
      # it a larger DB pool than the shared default (paired with mysql's
      # raised max-connections above).
      DB_POOL_SIZE: ${ALERT_INTELLIGENCE_DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${ALERT_INTELLIGENCE_DB_MAX_OVERFLOW:-30}
      MESSAGE_BUS_WORKER_COUNT: ${ALERT_INTELLIGENCE_WORKER_COUNT:-8}
      # Cheap normalization/correlation can safely reserve a larger batch.
      # Context and resolution retain the shared prefetch of two so LLM work
      # remains bounded even during an alert storm.
      RABBITMQ_CONSUMER_PREFETCH_COUNT: ${ALERT_INTELLIGENCE_PREFETCH_COUNT:-2}
      ALERT_CORRELATION_CANDIDATE_LIMIT: ${ALERT_CORRELATION_CANDIDATE_LIMIT:-250}
      # Correlation/qualification already has a deterministic implementation.
      # One remote model call per raw alert created the ingestion backlog and
      # delayed context/RCA for newer alerts.
      DISCOVERY_LLM_ENABLED: ${DISCOVERY_LLM_ENABLED:-false}
      ALERT_DEDUPLICATION_ENABLED: ${ALERT_DEDUPLICATION_ENABLED:-true}
      ALERT_DEDUPLICATION_WINDOW_MINUTES: ${ALERT_DEDUPLICATION_WINDOW_MINUTES:-60}
      # MESSAGE_BUS_WORKER_COUNT (shared default above) spins up N competing
      # consumer tasks in this one process/event loop - raising it adds I/O
      # concurrency (more DB round-trips/publishes in flight) but NOT CPU
      # parallelism, since alert correlation scoring is synchronous with no
      # await inside its scoring loop. For a real 10k burst, prefer running
      # multiple alert-intelligence replicas (RabbitMQ/Kafka competing
      # consumers already support this safely) over just raising this value.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/alert-intelligence
    mem_limit: ${ALERT_INTELLIGENCE_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    # Bare container port -- alert-intelligence is scale_service-eligible.
    # docker compose port alert-intelligence 8000
    ports: ["8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  orchestrator:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: orchestrator }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/orchestrator
    mem_limit: ${ORCHESTRATOR_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    # Bare container port -- orchestrator is scale_service-eligible.
    # docker compose port orchestrator 8000
    ports: ["8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      context-agent: { condition: service_started }
      resolution-agent: { condition: service_started }
      temporal: { condition: service_healthy }

  context-agent:
    build: *service-build
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${CONTEXT_AGENT_MEMORY_LIMIT:-1536m}
    cpus: ${CONTEXT_AGENT_CPU_LIMIT:-1.50}
    logging: *bounded-logging
    environment:
      <<: *service-env
      SERVICE_NAME: context-agent
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-kaiops-local-service-token-change-me}
      # Auto reuses complete cached context. Per event, realtime forces fresh
      # discovery and historical uses periodic snapshots without live calls.
      CONTEXT_STRATEGY: ${CONTEXT_STRATEGY:-auto}
      CONTEXT_KNOWLEDGE_TTL_SECONDS: ${CONTEXT_KNOWLEDGE_TTL_SECONDS:-14400}
      CONTEXT_MIN_QUALITY_SCORE: ${CONTEXT_MIN_QUALITY_SCORE:-0.70}
      CONTEXT_MAX_EVIDENCE_PER_SOURCE: ${CONTEXT_MAX_EVIDENCE_PER_SOURCE:-20}
      CONTEXT_COLLECTION_BUDGET_SECONDS: ${CONTEXT_COLLECTION_BUDGET_SECONDS:-45}
      CONTEXT_COLLECTION_LEASE_WAIT_SECONDS: ${CONTEXT_COLLECTION_LEASE_WAIT_SECONDS:-30}
      CONTEXT_RESOLUTION_REUSE_ENABLED: ${CONTEXT_RESOLUTION_REUSE_ENABLED:-true}
      CONTEXT_RESOLUTION_REUSE_MIN_SCORE: ${CONTEXT_RESOLUTION_REUSE_MIN_SCORE:-0.70}
      CONTEXT_HISTORICAL_MAX_AGE_SECONDS: ${CONTEXT_HISTORICAL_MAX_AGE_SECONDS:-86400}
      MESSAGE_BUS_WORKER_COUNT: ${CONTEXT_AGENT_WORKER_COUNT:-2}
      DISCOVERY_MCP_URL: http://discovery-mcp:8000/mcp
      DISCOVERY_MCP_TIMEOUT_SECONDS: ${DISCOVERY_MCP_TIMEOUT_SECONDS:-15}
      DISCOVERY_MCP_MAX_EVIDENCE: ${DISCOVERY_MCP_MAX_EVIDENCE:-12}
      # Context retrieves and persists evidence; resolution performs the single
      # synchronous RCA synthesis. This avoids duplicate LLM calls per alert.
      CONTEXT_DISCOVERY_MODEL_ANALYSIS_ENABLED: ${CONTEXT_DISCOVERY_MODEL_ANALYSIS_ENABLED:-false}
      CODE_DISCOVERY_ROOTS: /app/backend/src,/app/ai-workbench/src,/app/scripts,/app/config,/app/observability,/app/backend/rag,/app/fault-lab
      LOG_DISCOVERY_ROOTS: /data/fault-lab/runtime,/app/backend/runtime
      DISCOVERY_MAX_FILES: ${DISCOVERY_MAX_FILES:-60}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/context-agent
    # Bare container port -- context-agent is scale_service-eligible.
    # docker compose port context-agent 8000
    ports: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend/rag:/app/rag
      # Review drafts are runtime state. Keep them on a Docker-managed volume
      # so hardened/rootless hosts can write them even when the source bind
      # mount is read-only or owned by the deployment account.
      - ./fault-lab:/data/fault-lab:ro
      - ./backend/ingested_alerts:/data/landing:ro
      - ./observability:/app/observability:ro
      - ./backend/runtime:/app/backend/runtime:ro
      - ./backend/ingested_alerts:/app/backend/ingested_alerts:ro
    depends_on:
      migrations: { condition: service_completed_successfully }
      discovery-mcp: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  discovery-mcp:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: discovery-mcp
      DISCOVERY_MCP_CODE_ROOTS: /workspace/backend/src,/workspace/ai-workbench/src,/workspace/frontend/react/src,/workspace/scripts,/workspace/config,/workspace/observability,/workspace/fault-lab,/workspace/docs
      DISCOVERY_MCP_LOG_ROOTS: /data/fault-lab/runtime,/workspace/fault-lab/runtime,/workspace/backend/runtime
      DISCOVERY_MCP_TICKET_ROOTS: /workspace/backend/rag,/data/tickets,/data/landing/documents
      DISCOVERY_MCP_MYSQL_TABLES: alerts,incident_projections,incidents,closed_incidents,onboarding_state
      DISCOVERY_MCP_MAX_FILES: ${DISCOVERY_MCP_MAX_FILES:-30}
      DISCOVERY_MCP_MAX_TICKET_FILES: ${DISCOVERY_MCP_MAX_TICKET_FILES:-40}
      DISCOVERY_MCP_MYSQL_MAX_ROWS: ${DISCOVERY_MCP_MYSQL_MAX_ROWS:-50}
      DISCOVERY_MCP_PROJECTS_FILE: /workspace/backend/config/discovery-projects.json
      DISCOVERY_MCP_TELEMETRY_TIMEOUT_SECONDS: "6"
      # This service's Jira evidence search (discovery-mcp/app.py) uses a
      # different env var naming convention than monitoring-adapter's
      # outbound Jira client (JIRA_API_BASE_URL/JIRA_API_EMAIL) — these
      # were previously pointed at undefined JIRA_URL/JIRA_USER_EMAIL host
      # vars (always empty), silently disabling live Jira evidence search.
      # Aliased to the same real credentials instead of a second secret set.
      JIRA_URL: ${JIRA_API_BASE_URL:-}
      JIRA_USER_EMAIL: ${JIRA_API_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      DOCKER_LOG_DISCOVERY_ENABLED: ${DOCKER_LOG_DISCOVERY_ENABLED:-true}
      DOCKER_LOG_DISCOVERY_MAX_CONTAINERS: ${DOCKER_LOG_DISCOVERY_MAX_CONTAINERS:-12}
      DOCKER_LOG_DISCOVERY_TAIL: ${DOCKER_LOG_DISCOVERY_TAIL:-80}
      DOCKER_LOG_DISCOVERY_HOST: docker-socket-proxy:2375
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/discovery-mcp
    mem_limit: ${DISCOVERY_MCP_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    # Bare container port -- discovery-mcp is scale_service-eligible.
    # docker compose port discovery-mcp 8000
    ports: ["8000"]
    volumes:
      - ./:/workspace:ro
      - ./fault-lab:/data/fault-lab:ro
      - ./backend/ingested_alerts:/data/landing:ro
      - ${KAI_OPS_TICKET_SAMPLE_PATH:-./backend/ingested_alerts}:/data/tickets:ro
    depends_on:
      docker-socket-proxy: { condition: service_started }
      migrations: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Exposes a *read-only, containers-only* view of the Docker API over TCP so discovery-mcp
  # never touches /var/run/docker.sock directly. A raw socket mount (even with ":ro" on the
  # bind mount) grants the full Docker API -- create/exec/mount -- which is host-root
  # equivalent. The proxy restricts access to /containers*; POST is enabled so
  # the governed Jenkins allowlist can restart an explicitly named container.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    mem_limit: ${DOCKER_SOCKET_PROXY_MEMORY_LIMIT:-128m}
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      # Narrowly widened so the Jenkins agent's `docker compose scale` can
      # add a correctly-networked replica of an internal service (see
      # deploy/jenkins/Dockerfile.local and Jenkinsfile.auto-remediation's
      # approvedComposeScaleCommand): NETWORKS/IMAGES/VOLUMES let Compose
      # resolve an existing service's network and confirm its image and any
      # named volumes are already present, never build or pull new ones.
      # Every other resource group (EXEC, BUILD, SECRETS, SWARM, SERVICES,
      # NODES, PLUGINS, TASKS, CONFIGS, DISTRIBUTION, COMMIT, AUTH) stays at
      # its default of disabled.
      NETWORKS: 1
      IMAGES: 1
      VOLUMES: 1
      BUILD: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  model-router:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: model-router }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/model-router
    mem_limit: ${MODEL_ROUTER_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    # Bare container port -- model-router is scale_service-eligible.
    # docker compose port model-router 8000
    ports: ["8000"]
    volumes:
      - ./backend/evaluation:/app/backend/evaluation:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  resolution-agent:
    build: *service-build
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${RESOLUTION_AGENT_MEMORY_LIMIT:-1536m}
    cpus: ${RESOLUTION_AGENT_CPU_LIMIT:-1.50}
    logging: *bounded-logging
    environment:
      <<: *service-env
      SERVICE_NAME: resolution-agent
      CONTEXT_RESOLUTION_REUSE_ENABLED: ${CONTEXT_RESOLUTION_REUSE_ENABLED:-true}
      CONTEXT_RESOLUTION_REUSE_MIN_SCORE: ${CONTEXT_RESOLUTION_REUSE_MIN_SCORE:-0.70}
      RESOLUTION_MODEL_PAYLOAD_MAX_BYTES: ${RESOLUTION_MODEL_PAYLOAD_MAX_BYTES:-48000}
      # Keep the model attempt inside the message-handler budget. The global
      # defaults are intentionally broader for other services, but an RCA
      # worker must still have time to persist deterministic fallback output
      # and acknowledge the event after a provider timeout.
      LLM_REQUEST_TIMEOUT_SECONDS: ${RESOLUTION_LLM_REQUEST_TIMEOUT_SECONDS:-45}
      # Allow the bounded investigation plus RCA and impact calls, with time
      # remaining to persist the outcome and acknowledge the delivery.
      RABBITMQ_HANDLER_TIMEOUT_SECONDS: ${RESOLUTION_HANDLER_TIMEOUT_SECONDS:-240}
      MESSAGE_BUS_WORKER_COUNT: ${RESOLUTION_AGENT_WORKER_COUNT:-2}
      # Assess impact independently from optional remediation generation.
      # Disabling deep analysis must not silently disable impact assessment.
      RESOLUTION_IMPACT_ANALYSIS_ENABLED: ${RESOLUTION_IMPACT_ANALYSIS_ENABLED:-true}
      RESOLUTION_DEEP_ANALYSIS_ENABLED: ${RESOLUTION_DEEP_ANALYSIS_ENABLED:-false}
      RESOLUTION_ITERATIVE_INVESTIGATION_ENABLED: ${RESOLUTION_ITERATIVE_INVESTIGATION_ENABLED:-true}
      # The investigator can require all ten bounded evidence planes. Keep the
      # default step budget large enough to query each plane once; a smaller
      # budget deterministically leaves every local RCA inconclusive.
      # Raised 10->12 (the code's own hard ceiling in investigation.py's
      # `max(1, min(..., 12))`) after live E2E testing showed a real
      # investigation exhausting all 10 steps on exactly one full sweep of
      # every evidence plane, with zero steps left for a follow-up query to
      # confirm a real mechanism hypothesis that had reached 0.5447
      # confidence - just under the 0.55 threshold to be treated as
      # "leading" - while still having used less than half its evidence
      # budget (74/150). RESOLUTION_INVESTIGATION_MAX_TOOL_CALLS is already
      # 12; this now matches it.
      RESOLUTION_INVESTIGATION_MAX_STEPS: ${RESOLUTION_INVESTIGATION_MAX_STEPS:-12}
      RESOLUTION_INVESTIGATION_MAX_TOOL_CALLS: ${RESOLUTION_INVESTIGATION_MAX_TOOL_CALLS:-12}
      RESOLUTION_INVESTIGATION_MAX_DURATION_SECONDS: ${RESOLUTION_INVESTIGATION_MAX_DURATION_SECONDS:-90}
      # Raised from 40: that default left 47% of investigations (measured
      # live) stopping after ~1.5 steps once pre-existing alert context alone
      # filled the budget, before ever querying most required evidence
      # categories (telemetry, data, topology, changes, dependency).
      RESOLUTION_INVESTIGATION_MAX_EVIDENCE: ${RESOLUTION_INVESTIGATION_MAX_EVIDENCE:-150}
      # Partial evidence may conclude RCA when two independent, current sources
      # corroborate an actual causal mechanism. Missing optional planes remain
      # visible as gaps and penalties; symptom-only observations never qualify.
      RESOLUTION_INVESTIGATION_CONCLUSIVE_THRESHOLD: ${RESOLUTION_INVESTIGATION_CONCLUSIVE_THRESHOLD:-0.65}
      # How many independently-sourced evidence records must corroborate a
      # hypothesis before it can be marked "confirmed", on top of the
      # confidence bar above. 2 is the conservative default; lower to 1 where
      # evidence is structurally thin (e.g. no tracing) but confidence is
      # still met - never set to 0, an uncorroborated hypothesis must not
      # auto-confirm on confidence alone.
      RESOLUTION_INVESTIGATION_MIN_SOURCES: ${RESOLUTION_INVESTIGATION_MIN_SOURCES:-2}
      # Off by default. See resolution_agent/policy.py's deployment-override
      # comment for exactly which gates must all pass before this changes any
      # behavior - it never lowers any individual safety gate on its own.
      RESOLUTION_AUTO_EXECUTION_ENABLED: ${RESOLUTION_AUTO_EXECUTION_ENABLED:-false}
      # Needed only to call approval-service's own /approve endpoint under the
      # policy-engine identity when the override above accepts a selection;
      # must match approval-service's copy of the same shared secret.
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-kaiops-local-service-token-change-me}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/resolution-agent
    # Bare container port -- resolution-agent is scale_service-eligible.
    # docker compose port resolution-agent 8000
    ports: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      migrations: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      model-router: { condition: service_started }
      discovery-mcp: { condition: service_started }

  approval-service:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: approval-service
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-kaiops-local-service-token-change-me}
      # Independently re-checked here, not just trusted from resolution-agent's
      # decision - a "policy-engine" approval is rejected unless this
      # service's own copy of the flag is also enabled.
      RESOLUTION_AUTO_EXECUTION_ENABLED: ${RESOLUTION_AUTO_EXECUTION_ENABLED:-false}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/approval-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    expose: ["8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  notification-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: notification-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/notification-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8019:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  evaluation-service:
    build: *service-build
    restart: unless-stopped
    environment: { <<: *service-env, SERVICE_NAME: evaluation-service }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/ai-workbench/src/evaluation-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8020:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      temporal: { condition: service_healthy }

  temporal-pilot-worker:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: temporal-workflow-worker
      TEMPORAL_PILOT_ENABLED: "true"
      REMEDIATION_TEMPORAL_ENABLED: "true"
      REMEDIATION_TEMPORAL_TASK_QUEUE: kaiops-remediation
      REMEDIATION_INTERNAL_TOKEN: ${REMEDIATION_INTERNAL_TOKEN:-kaiops-local-temporal-remediation}
      AI_LAYER_REQUEST_TIMEOUT_SECONDS: "1500"
    command: ["python", "-m", "temporal_pilot.worker"]
    mem_limit: ${TEMPORAL_WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    working_dir: /app
    depends_on:
      mysql: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert any('temporal_pilot.worker' in p.read_bytes().decode('utf-8','ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  remediation-engine:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: remediation-engine
      REMEDIATION_TEMPORAL_ENABLED: "true"
      REMEDIATION_TEMPORAL_TASK_QUEUE: kaiops-remediation
      REMEDIATION_INTERNAL_TOKEN: ${REMEDIATION_INTERNAL_TOKEN:-kaiops-local-temporal-remediation}
      RCA_RESOLUTION_AUTO_COMPLETE_THRESHOLD: ${RCA_RESOLUTION_AUTO_COMPLETE_THRESHOLD:-0.70}
      JENKINS_USERNAME: ${JENKINS_USERNAME:-kaiops}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-kaiops-local-token}
      REMEDIATION_DEFAULT_EXECUTOR: ${REMEDIATION_DEFAULT_EXECUTOR:-jenkins}
      REMEDIATION_JENKINS_URL: ${REMEDIATION_JENKINS_URL:-http://jenkins:8080}
      REMEDIATION_JENKINS_JOB: ${REMEDIATION_JENKINS_JOB:-kaiops-auto-remediation}
      REMEDIATION_JENKINS_CREDENTIAL_REF: ${REMEDIATION_JENKINS_CREDENTIAL_REF:-vault://kaiops/local/jenkins#api-token}
      REMEDIATION_EXECUTION_PLATFORM: ${REMEDIATION_EXECUTION_PLATFORM:-docker-compose}
      REMEDIATION_COMPOSE_PROJECT: ${REMEDIATION_COMPOSE_PROJECT:-${COMPOSE_PROJECT_NAME:-kaiops_azure}}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/remediation-engine
    mem_limit: ${REMEDIATION_ENGINE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    # Bare container port -- remediation-engine is scale_service-eligible.
    # docker compose port remediation-engine 8000
    ports: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/executors/readiness', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }
      jenkins: { condition: service_healthy }
      temporal: { condition: service_healthy }
      temporal-pilot-worker: { condition: service_healthy }

  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      JENKINS_BOOTSTRAP_USERNAME: ${JENKINS_USERNAME:-kaiops}
      JENKINS_BOOTSTRAP_PASSWORD: ${JENKINS_API_TOKEN:-kaiops-local-token}
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Xms128m -Xmx512m -Djenkins.install.runSetupWizard=false}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports: ["${JENKINS_HOST_PORT:-8083}:8080"]
    mem_limit: ${JENKINS_MEMORY_LIMIT:-1g}
    logging: *bounded-logging
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./deploy/jenkins/Jenkinsfile.auto-remediation:/opt/kaiops/Jenkinsfile.auto-remediation:ro
      - ./scripts/remediation:/opt/kaiops/scripts/remediation:ro
      # Scaling a Compose service (unlike restart) has no engine-level
      # primitive; only the real `docker compose` CLI knows how, and it
      # needs this project's actual compose file to resolve a service's
      # image/env/network config for a new replica.
      - ./docker-compose.yml:/opt/kaiops/docker-compose.yml:ro
    depends_on:
      docker-socket-proxy: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s

  closure-service:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: closure-service
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-kaiops-local-service-token-change-me}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/closure-service
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    # Bare container port -- closure-service is scale_service-eligible.
    # docker compose port closure-service 8000
    ports: ["8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql: { condition: service_healthy }

  knowledge-development-worker:
    build: *service-build
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVICE_NAME: knowledge-development-worker
      KNOWLEDGE_DEVELOPMENT_INTERVAL_SECONDS: ${KNOWLEDGE_DEVELOPMENT_INTERVAL_SECONDS:-21600}
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/knowledge-development-worker
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    ports: ["8022:8000"]
    depends_on:
      mysql: { condition: service_healthy }

  ui:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ui
      args:
        KAIMS_RELEASE_SHA: ${KAIMS_RELEASE_SHA:-dev}
        KAIMS_BUILD_TIME: ${KAIMS_BUILD_TIME:-unknown}
        KAIMS_REQUIRE_RELEASE_PROVENANCE: ${KAIMS_REQUIRE_RELEASE_PROVENANCE:-false}
    # Docker Desktop's IPv6 localhost forwarder can accept connections without
    # forwarding them. Bind IPv4 explicitly so Windows falls back from ::1.
    ports: ["${UI_BIND_ADDRESS:-127.0.0.1}:${UI_HOST_PORT:-80}:80"]
    mem_limit: ${UI_MEMORY_LIMIT:-128m}
    logging: *bounded-logging
    restart: unless-stopped
    # The static UI must remain available while backend services recover. Its
    # nginx proxy reports backend failures without preventing the UI/login page
    # from starting, so backend health is intentionally not a startup gate.

  ui-dev:
    profiles: ["ui-dev"]
    image: node:20-alpine
    mem_limit: ${UI_DEV_MEMORY_LIMIT:-1g}
    logging: *bounded-logging
    working_dir: /app
    command: ["sh", "-lc", "if [ ! -x node_modules/.bin/vite ]; then npm ci --prefer-offline --no-audit --no-fund; fi; npm run dev"]
    environment:
      KAIMS_DEV_API_GATEWAY: http://api-gateway:8000
      KAIMS_DEV_MONITORING_ADAPTER: http://monitoring-adapter:8000
      KAIMS_DEV_APPROVAL_SERVICE: http://approval-service:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/react:/app
      - ui-dev-node-modules:/app/node_modules
      - ui-dev-npm-cache:/root/.npm
    ports: ["8502:8501"]
    depends_on:
      api-gateway: { condition: service_healthy }

  # --- Online Boutique (GoogleCloudPlatform/microservices-demo) ---
  # No official docker-compose.yml exists upstream (it's Kubernetes/Skaffold-
  # native), so this references the same pinned v0.10.6 images the official
  # Kubernetes release manifest uses, not a rebuild from source. Verified
  # against the actual source: these services have no app-level Prometheus
  # metrics (initStats() is an unimplemented TODO in every service), so
  # metrics come from ob-cadvisor (real per-container signals) and the
  # existing blackbox-exporter (real HTTP probes), not fabricated numbers.
  # All service names are ob-prefixed to avoid colliding with this
  # project's own redis/mysql/etc.
  ob-redis-cart:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: redis:alpine
    restart: unless-stopped

  ob-currencyservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  ob-productcatalogservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  ob-paymentservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  ob-shippingservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  ob-emailservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  ob-adservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "9555"

  ob-cartservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice:v0.10.6
    restart: unless-stopped
    environment:
      REDIS_ADDR: ob-redis-cart:6379
    depends_on:
      - ob-redis-cart

  ob-recommendationservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: ob-productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on:
      - ob-productcatalogservice

  ob-checkoutservice:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice:v0.10.6
    restart: unless-stopped
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: ob-productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: ob-shippingservice:50051
      PAYMENT_SERVICE_ADDR: ob-paymentservice:50051
      EMAIL_SERVICE_ADDR: ob-emailservice:8080
      CURRENCY_SERVICE_ADDR: ob-currencyservice:7000
      CART_SERVICE_ADDR: ob-cartservice:7070
    depends_on:
      - ob-productcatalogservice
      - ob-shippingservice
      - ob-paymentservice
      - ob-emailservice
      - ob-currencyservice
      - ob-cartservice

  ob-frontend:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.6
    restart: unless-stopped
    ports:
      - "8081:8080"   # 8080 already used by fault-lab
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: ob-productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: ob-currencyservice:7000
      CART_SERVICE_ADDR: ob-cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: ob-recommendationservice:8080
      SHIPPING_SERVICE_ADDR: ob-shippingservice:50051
      CHECKOUT_SERVICE_ADDR: ob-checkoutservice:5050
      AD_SERVICE_ADDR: ob-adservice:9555
      # Required by mustMapEnv() even though we don't run this optional AI
      # feature — gRPC dials are lazy, so an unreachable placeholder is
      # enough to satisfy startup without crashing frontend.
      SHOPPING_ASSISTANT_SERVICE_ADDR: ob-shopping-assistant:8080
    depends_on:
      - ob-productcatalogservice
      - ob-currencyservice
      - ob-cartservice
      - ob-recommendationservice
      - ob-shippingservice
      - ob-checkoutservice
      - ob-adservice

  ob-loadgenerator:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.6
    restart: unless-stopped
    environment:
      FRONTEND_ADDR: ob-frontend:8080
      USERS: "10"
      RATE: "1"
    depends_on:
      - ob-frontend

  # Real per-container metrics (CPU, memory, network, restart count) — the
  # only genuine metrics source available since Online Boutique has no
  # app-level /metrics endpoint anywhere.
  ob-cadvisor:
    profiles: ["demo-online-boutique"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # --- Robot Shop (instana/robot-shop) ---
  # Deliberately different failure surface from Online Boutique: real
  # RabbitMQ queue, real MongoDB/MySQL/Redis datastores. Uses the public
  # pre-built robotshop/rs-*:2.1.0 images (REPO=robotshop, TAG=2.1.0 per
  # upstream's own .env), not a rebuild from source. rs-cart and
  # rs-payment already expose real Prometheus /metrics natively; standard
  # community exporters are added for the rest.
  #
  # IMPORTANT: rs-web's nginx config is baked into the image at build time
  # with hardcoded upstream hostnames (catalogue, user, shipping, payment,
  # etc — confirmed live: renaming those services crash-looped rs-web with
  # "host not found in upstream 'catalogue'"). These aren't
  # env-var-configurable. So every Robot Shop service keeps a unique
  # compose key (rs-*, to avoid colliding with this project's own
  # redis/mysql/rabbitmq) but is given a network alias equal to the short
  # name its siblings expect, scoped to the isolated robot-shop-net network
  # below — the alias never collides with the main project's own
  # redis/mysql/rabbitmq because it only exists inside that isolated
  # network, not the default one.
  rs-mongodb:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-mongodb:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [mongodb]

  rs-redis:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [redis]

  rs-rabbitmq:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: rabbitmq:3.8-management-alpine
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [rabbitmq]

  rs-mysql:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-mysql-db:2.1.0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      robot-shop-net:
        aliases: [mysql]

  rs-catalogue:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-catalogue:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [catalogue]
    depends_on:
      - rs-mongodb

  rs-user:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-user:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [user]
    depends_on:
      - rs-mongodb
      - rs-redis

  rs-cart:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-cart:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [cart]
      default: {}
    depends_on:
      - rs-redis

  rs-shipping:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-shipping:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [shipping]
    depends_on:
      - rs-mysql

  rs-ratings:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-ratings:2.1.0
    restart: unless-stopped
    environment:
      APP_ENV: prod
    networks:
      robot-shop-net:
        aliases: [ratings]
    depends_on:
      - rs-mysql

  rs-payment:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-payment:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [payment]
      default: {}
    depends_on:
      - rs-rabbitmq

  rs-dispatch:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-dispatch:2.1.0
    restart: unless-stopped
    networks:
      robot-shop-net:
        aliases: [dispatch]
    depends_on:
      - rs-rabbitmq

  rs-web:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: robotshop/rs-web:2.1.0
    restart: unless-stopped
    ports:
      - "8090:8080"
    networks:
      robot-shop-net:
        aliases: [web]
      default: {}
    depends_on:
      - rs-catalogue
      - rs-user
      - rs-shipping
      - rs-payment

  # robotshop/rs-load-gen isn't published to Docker Hub (upstream builds it
  # from source only) — using the standard public locustio/locust image
  # with a minimal locustfile instead, same effect: continuous real traffic.
  rs-load-gen:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: locustio/locust:2.32.4
    restart: unless-stopped
    volumes:
      - ./realistic-apps/robot-shop/locustfile.py:/mnt/locust/locustfile.py:ro
    command: -f /mnt/locust/locustfile.py --host http://web:8080 --headless -u 5 -r 1
    networks:
      - robot-shop-net
    depends_on:
      - rs-web

  # cart/payment already expose real Prometheus /metrics natively — these
  # exporters also join "default" so the main project's Prometheus (which
  # is not on robot-shop-net) can scrape them.
  rs-mysqld-exporter:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: prom/mysqld-exporter:v0.19.0
    restart: unless-stopped
    # v0.19.0 dropped DATA_SOURCE_NAME env var support in favor of a
    # .my.cnf file (confirmed live: env-var-only config crash-looped with
    # "no user specified in section or parent").
    command:
      - "--config.my-cnf=/etc/mysql/my.cnf"
    volumes:
      - ./realistic-apps/robot-shop/my.cnf:/etc/mysql/my.cnf:ro
    networks:
      - robot-shop-net
      - default
    depends_on:
      - rs-mysql

  rs-redis-exporter:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: oliver006/redis_exporter:v1.88.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://rs-redis:6379
    networks:
      - robot-shop-net
      - default
    depends_on:
      - rs-redis

  rs-rabbitmq-exporter:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: kbudde/rabbitmq-exporter:1.0.0
    restart: unless-stopped
    environment:
      RABBIT_URL: http://rs-rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      PUBLISH_PORT: "9419"
    networks:
      - robot-shop-net
      - default
    depends_on:
      - rs-rabbitmq

  rs-mongodb-exporter:
    profiles: ["demo-robot-shop"]
    mem_limit: ${DEMO_SERVICE_MEMORY_LIMIT:-512m}
    logging: *bounded-logging
    image: percona/mongodb_exporter:0.51.0
    restart: unless-stopped
    command:
      - "--mongodb.uri=mongodb://rs-mongodb:27017"
      - "--collect-all"
    networks:
      - robot-shop-net
      - default
    depends_on:
      - rs-mongodb

networks:
  default:
    external: true
    name: kaims_default
  # Isolated network for Robot Shop's internal service mesh — its images
  # have hostnames like "mongodb"/"redis"/"mysql"/"rabbitmq"/"catalogue"
  # baked in at build time (nginx config, not env-var configurable), which
  # would collide with this project's own services of the same name if
  # placed on the shared default network. See the comment above the
  # Robot Shop services for details.
  robot-shop-net: {}

volumes:
  mysql-data:
  jaeger-data:
  redis-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  rabbitmq-data:
  rabbitmq-data-recovery:
  grafana-data:
  ui-dev-node-modules:
  ui-dev-npm-cache:
  jenkins-data:
