# Independent monitoring lifecycle; application networks and data are external.
name: monitoring
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: always
    logging: *bounded-logging
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=3d
    - --storage.tsdb.retention.size=2GB
    - --query.max-concurrency=10
    - --web.enable-lifecycle
    ports:
    - 9090:9090
    volumes:
    - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../../observability/recovery-kaims-http-targets.json:/etc/prometheus/recovery-kaims-http-targets.json:ro
    - prometheus-data:/prometheus
    - ../../observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    - ../../backend/rag/changes/prometheus_rules:/etc/prometheus/generated-rules:ro
    - ../../backend/rag/changes/prometheus_targets:/etc/prometheus/generated-targets:ro
    networks:
      kaims:
        aliases:
        - prometheus
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    logging: *bounded-logging
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    ports:
    - 9093:9093
    volumes:
    - alertmanager-data:/alertmanager
    - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      kaims:
        aliases:
        - alertmanager
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:9093/-/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: always
    logging: *bounded-logging
    command:
    - --config.file=/etc/blackbox_exporter/config.yml
    ports:
    - 9115:9115
    volumes:
    - ../../observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      kaims:
        aliases:
        - blackbox-exporter
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:9115/-/healthy
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  telemetry-prometheus:
    image: quay.io/prometheus/prometheus:v3.13.1
    restart: always
    logging: *bounded-logging
    command:
    - --web.console.templates=/etc/prometheus/consoles
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=2GB
    - --config.file=/etc/prometheus/prometheus-config.yaml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    - --web.route-prefix=/
    - --web.enable-otlp-receiver
    - --enable-feature=exemplar-storage
    ports:
    - 19090:9090
    volumes:
    - ../../deploy/telemetry/prometheus-kaiops.yaml:/etc/prometheus/prometheus-config.yaml:ro
    - ../../deploy/telemetry/telemetry-alerts.yml:/etc/prometheus/telemetry-alerts.yml:ro
    - telemetry-prometheus-data:/prometheus
    networks:
      telemetry:
        aliases:
        - prometheus
      kaims:
        aliases:
        - telemetry-prometheus
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
networks:
  kaims:
    external: true
    name: kaims_default
  telemetry:
    external: true
    name: opentelemetry-demo
volumes:
  prometheus-data:
    external: true
    name: ${PROMETHEUS_DATA:-monitoring_prometheus-data}
  alertmanager-data:
    external: true
    name: ${ALERTMANAGER_DATA:-monitoring_alertmanager-data}
  telemetry-prometheus-data:
    external: true
    name: ${TELEMETRY_PROMETHEUS_DATA:-monitoring_telemetry-prometheus-data}
